# Secret Scan — gitleaks over full history on every PR.
#
# PR-triggered only (never push/tag — see taka's 26-04-24 Gitea Actions Replay
# Incident: push/tag triggers refire under history rewrites). Catches committed
# secrets and unmasked card PANs before they land on main.

name: Secret Scan

on:
  pull_request:
    branches: [main]

# Cancel an in-flight scan when a new commit lands on the same PR — only the tip
# needs scanning, so superseded runs are dropped instead of queuing.
concurrency:
  group: secret-scan-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for gitleaks git

      - name: Install gitleaks
        run: |
          # renovate: datasource=github-releases depName=gitleaks/gitleaks
          GITLEAKS_VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan repository history
        run: gitleaks git . --no-banner --redact --config .gitleaks.toml
